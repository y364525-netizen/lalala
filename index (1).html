<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Birthday Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #0d0b14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* 隐藏 MediaPipe 需要的原始 Video 标签 */
    #webcam { display: none; }
    
    /* 摄像头预览与调试小窗 */
    #camera-preview {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 160px;
      height: 120px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      z-index: 10;
      overflow: hidden;
      transform: scaleX(-1); /* 镜像翻转 */
    }
    #canvas-out {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 现代感简洁 UI 遮罩 */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #ffffff;
      pointer-events: none;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 10px;
    }
    .title { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.6; margin-bottom: 4px; }
    .value { font-size: 18px; font-weight: 600; color: #ffe6a7; }

    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(20, 15, 30, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      border-radius: 30px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    #loading {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0d0b14;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 18px;
      transition: opacity 0.8s ease;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #ffb703;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div>INITIALIZING EXPERIENCE...</div>
  </div>

  <div id="webgl-container"></div>

  <!-- UI 层 -->
  <div id="ui-overlay">
    <div class="status-card">
      <div class="title">GESTURE CONTROL</div>
      <div id="gesture-status" class="value">Detecting Hand...</div>
    </div>
  </div>

  <div id="instructions">
    🖐 OPEN HAND TO UNFOLD CARD &bull; ✊ CLOSE HAND TO FOLD &bull; DRAG MOUSE TO ROTATE
  </div>

  <!-- 摄像头小窗 -->
  <div id="camera-preview">
    <video id="webcam" playsinline></video>
    <canvas id="canvas-out"></canvas>
  </div>

  <script>
    // --- 1. 全局配置与状态 ---
    const STATE = {
      isOpen: false,
      targetProgress: 0, // 0 闭合, 1 打开
      currentProgress: 0,
      audioPlaying: false
    };

    const WISH_TEXT = `生日快乐啊啊啊啊 🎂终于21啦啦啦 祝你21岁天天开心 幸福 少抽烟喝酒 希望你开心到不需要再抽烟了。也希望你也可以一切顺利！！不需要再老焦虑了 虽然我知道你控制不住。但是我真心希望你可以不再内耗受伤[可怜] 你很善良仗义耐心漂亮性感对很多事情都很认真严谨。虽然有时候会急 但这也算一种反差！我在认识你之前就隐隐感觉会和你相遇看见你在群里发言 也很惊讶我们已经认识了大约四年了。不过时间不重要，毕竟我们能做一直的好闺蜜！我可以以后的每年都给你写这些话～等我们一起住上比弗利！再次祝你生日快乐！不过这也不代表你能买更多酒哦！年轻的时候少喝点！希望你一直健健康康的！！这是最重要的！`;

    // --- 2. THREE.JS 场景构建 ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d0b14, 0.03);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;
    controls.minDistance = 5;
    controls.maxDistance = 18;

    // --- 3. 电影感光照 (微弱烛光与暖辉) ---
    const ambientLight = new THREE.AmbientLight(0x1a0f2e, 0.8);
    scene.add(ambientLight);

    // 主暖色烛光
    const candleLight = new THREE.PointLight(0xffaa44, 2.5, 15);
    candleLight.position.set(0, 1, 2);
    candleLight.castShadow = true;
    candleLight.shadow.mapSize.width = 1024;
    candleLight.shadow.mapSize.height = 1024;
    scene.add(candleLight);

    // 背景环境微弱烛光
    const candleLight2 = new THREE.PointLight(0xff6600, 1.2, 20);
    candleLight2.position.set(-4, -2, -3);
    scene.add(candleLight2);

    // 顶部冷色补光，增加电影级色彩对比
    const rimLight = new THREE.DirectionalLight(0x4d6688, 0.6);
    rimLight.position.set(0, 10, -5);
    scene.add(rimLight);

    // --- 4. 动态 Canvas 材质生成器 ---
    // 封面材质 (可爱绿色生日蛋糕)
    function createCoverTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1448;
      const ctx = canvas.getContext('2d');

      // 背景
      ctx.fillStyle = '#f3f8f2';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 边框装饰线
      ctx.strokeStyle = '#a3b18a';
      ctx.lineWidth = 12;
      ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

      // 画绿蛋糕 (以 (512, 850) 为中心)
      ctx.save();
      ctx.translate(512, 850);

      // 盘子
      ctx.fillStyle = '#e9ecef';
      ctx.beginPath();
      ctx.ellipse(0, 160, 260, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      // 蛋糕底层 (可爱马卡龙绿)
      ctx.fillStyle = '#84a98c';
      ctx.beginPath();
      ctx.roundRect(-200, -20, 400, 170, 20);
      ctx.fill();

      // 蛋糕顶层
      ctx.fillStyle = '#a3b18a';
      ctx.beginPath();
      ctx.roundRect(-160, -140, 320, 130, 15);
      ctx.fill();

      // 奶油挤花装饰
      ctx.fillStyle = '#ffffff';
      for(let x = -150; x <= 150; x += 30) {
        ctx.beginPath();
        ctx.arc(x, -140, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, -20, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      // 蜡烛与烛火
      ctx.fillStyle = '#f4a261';
      ctx.fillRect(-10, -220, 20, 80);
      
      // 火焰
      const grad = ctx.createRadialGradient(0, -235, 2, 0, -235, 25);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, '#ffb703');
      grad.addColorStop(1, 'rgba(217, 119, 6, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, -235, 25, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 英文标题
      ctx.fillStyle = '#354f52';
      ctx.font = 'bold 64px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('HAPPY BIRTHDAY', 512, 300);
      ctx.font = '36px "Segoe UI", sans-serif';
      ctx.fillStyle = '#52796f';
      ctx.fillText('MAKE A WISH', 512, 370);

      return new THREE.CanvasTexture(canvas);
    }

    // 内页文字材质
    function createTextTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1448;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#fdfbf7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 淡色背景水印感装饰
      ctx.strokeStyle = '#f0ead6';
      ctx.lineWidth = 4;
      ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

      // 中文祝福语多行绘制
      ctx.fillStyle = '#2b2d42';
      ctx.font = '38px "Microsoft YaHei", "PingFang SC", sans-serif';
      
      const padding = 80;
      const maxWidth = canvas.width - padding * 2;
      const lineHeight = 58;
      let x = padding;
      let y = 120;

      // 简单的自动换行逻辑
      const chars = text.split('');
      let line = '';

      for (let n = 0; n < chars.length; n++) {
        let testLine = line + chars[n];
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = chars[n];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);

      return new THREE.CanvasTexture(canvas);
    }

    // --- 5. 构建 3D 贺卡模型 ---
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    const cardWidth = 4;
    const cardHeight = 5.6;
    const cardGeometry = new THREE.PlaneGeometry(cardWidth, cardHeight, 32, 32);

    // 动态绘制的材质
    const coverTex = createCoverTexture();
    const innerTextTex = createTextTexture(WISH_TEXT);

    // 下半部分 (底座)
    const bottomCoverMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 }); // 外壳底面
    const bottomInnerMat = new THREE.MeshStandardMaterial({ map: innerTextTex, roughness: 0.4 }); // 内页文字
    
    const bottomCoverMesh = new THREE.Mesh(cardGeometry, bottomCoverMat);
    bottomCoverMesh.rotation.x = Math.PI / 2;
    bottomCoverMesh.rotation.y = Math.PI;
    bottomCoverMesh.receiveShadow = true;

    const bottomInnerMesh = new THREE.Mesh(cardGeometry, bottomInnerMat);
    bottomInnerMesh.rotation.x = -Math.PI / 2;
    bottomInnerMesh.receiveShadow = true;

    const bottomPage = new THREE.Group();
    bottomPage.add(bottomCoverMesh);
    bottomPage.add(bottomInnerMesh);
    // 偏移几何中心至枢轴轴线
    bottomPage.children.forEach(m => m.position.set(0, -cardHeight / 2, 0));
    cardGroup.add(bottomPage);

    // 上半部分 (可翻开的封面页)
    const topPivot = new THREE.Group();
    topPivot.position.set(0, 0, 0); // 铰链位置

    const topCoverMat = new THREE.MeshStandardMaterial({ map: coverTex, roughness: 0.3 });
    const topInnerMat = new THREE.MeshStandardMaterial({ color: 0xfdfbf7, roughness: 0.5 }); // 内页留白/图案

    const topCoverMesh = new THREE.Mesh(cardGeometry, topCoverMat);
    topCoverMesh.rotation.x = -Math.PI / 2;
    topCoverMesh.castShadow = true;

    const topInnerMesh = new THREE.Mesh(cardGeometry, topInnerMat);
    topInnerMesh.rotation.x = Math.PI / 2;
    topInnerMesh.castShadow = true;

    topPivot.add(topCoverMesh);
    topPivot.add(topInnerMesh);
    topPivot.children.forEach(m => m.position.set(0, cardHeight / 2, 0));
    
    cardGroup.add(topPivot);

    // 调整贺卡整体初始倾角
    cardGroup.rotation.x = -Math.PI / 6;
    cardGroup.position.y = -0.5;

    // --- 6. 彩色爱心飞舞粒子系统 ---
    const heartCount = 70;
    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // 绘制爱心 2D 形状
    const heartShape = new THREE.Shape();
    const x = 0, y = 0;
    heartShape.moveTo(x + 0.25, y + 0.25);
    heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
    heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
    heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
    heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
    heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
    heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

    const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.03, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 });
    heartGeo.center();

    const colors = [0xff4d6d, 0xff758f, 0xffb3c1, 0xff70a6, 0xff9770, 0xffd670, 0xe2afff];
    const hearts = [];

    for (let i = 0; i < heartCount; i++) {
      const mat = new THREE.MeshStandardMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        roughness: 0.3,
        metalness: 0.1
      });
      const mesh = new THREE.Mesh(heartGeo, mat);
      mesh.scale.setScalar(0.12 + Math.random() * 0.15);
      mesh.visible = false;
      
      heartGroup.add(mesh);
      hearts.push({
        mesh: mesh,
        vel: new THREE.Vector3(),
        rotVel: new THREE.Vector3(),
        life: 0
      });
    }

    function triggerConfetti() {
      hearts.forEach(h => {
        h.mesh.visible = true;
        h.mesh.position.set((Math.random() - 0.5) * 1.5, 0, (Math.random() - 0.5) * 0.5);
        
        // 向上爆发并向四周扩散的速度
        h.vel.set(
          (Math.random() - 0.5) * 5,
          4 + Math.random() * 6,
          (Math.random() - 0.5) * 5
        );
        h.rotVel.set(
          Math.random() * 10,
          Math.random() * 10,
          Math.random() * 10
        );
        h.life = 1.0;
      });
    }

    function updateParticles(delta) {
      hearts.forEach(h => {
        if (h.life > 0) {
          h.life -= delta * 0.4;
          h.vel.y -= 9.8 * delta * 0.5; // 重力效果
          h.mesh.position.addScaledVector(h.vel, delta);
          h.mesh.rotation.x += h.rotVel.x * delta;
          h.mesh.rotation.y += h.rotVel.y * delta;
          
          if (h.life <= 0) {
            h.mesh.visible = false;
          }
        }
      });
    }

    // --- 7. Web Audio API 动态合成 Happy Birthday 音乐 ---
    let audioCtx = null;

    function playBirthdaySong() {
      if (STATE.audioPlaying) return;
      
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtx) audioCtx = new AudioContext();

      STATE.audioPlaying = true;

      // 简谱音高对应的频率 (C4 调)
      const notes = {
        'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
        'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99
      };

      // Happy Birthday To You 旋律序列 [音符, 拍子长度]
      const melody = [
        ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
        ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
        ['G4', 0.75], ['G4', 0.25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
        ['F5', 0.75], ['F5', 0.25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2.5]
      ];

      let now = audioCtx.currentTime + 0.1;
      const tempo = 0.45; // 每拍基准时间(秒)

      melody.forEach(([note, duration]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle'; // 温暖柔和的波形
        osc.frequency.setValueAtTime(notes[note], now);

        // 音量包络线 (淡入淡出，模仿八音盒/木琴)
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration * tempo - 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration * tempo);

        now += duration * tempo;
      });

      // 播放结束后重置状态
      setTimeout(() => {
        STATE.audioPlaying = false;
      }, (now - audioCtx.currentTime) * 1000);
    }

    // --- 8. MediaPipe Hands 手势识别集成 ---
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('canvas-out');
    const canvasCtx = canvasElement.getContext('2d');
    const gestureStatusEl = document.getElementById('gesture-status');

    function onResults(results) {
      // 隐去 Loading
      const loadingEl = document.getElementById('loading');
      if (loadingEl && loadingEl.style.opacity !== '0') {
        loadingEl.style.opacity = '0';
        setTimeout(() => loadingEl.remove(), 800);
      }

      // 绘制调试界面小窗
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // 简易手势判断：通过计算 4 个手指尖端到掌心(Node 0)的距离判断张开/合拢
        const wrist = landmarks[0];
        const tips = [8, 12, 16, 20]; // 食指、中指、无名指、小指尖端
        let isOpen = true;

        for (let tipIdx of tips) {
          const tip = landmarks[tipIdx];
          const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
          if (dist < 0.35) { // 阈值判别
            isOpen = false;
            break;
          }
        }

        if (isOpen) {
          gestureStatusEl.innerText = "🖐 Hand Open";
          gestureStatusEl.style.color = "#70e000";
          setCardState(true);
        } else {
          gestureStatusEl.innerText = "✊ Hand Closed";
          gestureStatusEl.style.color = "#ffb703";
          setCardState(false);
        }
      } else {
        gestureStatusEl.innerText = "No Hand Detected";
        gestureStatusEl.style.color = "#ffe6a7";
      }
      canvasCtx.restore();
    }

    function setCardState(open) {
      if (STATE.isOpen !== open) {
        STATE.isOpen = open;
        STATE.targetProgress = open ? 1 : 0;
        
        // 触发状态改变瞬间的音效与粒子
        if (open) {
          triggerConfetti();
          playBirthdaySong();
        }
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 320,
      height: 240
    });
    cameraUtils.start();

    // --- 9. 主循环渲染与动画控制 ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Lerp 阻尼平滑插值过渡贺卡打开/关闭角度
      STATE.currentProgress += (STATE.targetProgress - STATE.currentProgress) * 0.05;
      
      // 旋转角度映射: 0 (合上, 0rad) -> 1 (打开, ~Math.PI rad)
      topPivot.rotation.x = STATE.currentProgress * Math.PI * 0.95;

      // 电影感微弱烛火闪烁 (点光源强度与位置微妙抖动)
      candleLight.intensity = 2.3 + Math.sin(time * 12) * 0.15 + Math.cos(time * 23) * 0.1;
      candleLight.position.x = Math.sin(time * 3) * 0.1;

      // 粒子更新
      updateParticles(delta);

      // 控制器更新
      controls.update();

      // 渲染
      renderer.render(scene, camera);
    }

    animate();

    // --- 10. 响应式窗口调整 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
